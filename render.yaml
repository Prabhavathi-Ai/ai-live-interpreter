services:
  - type: web
    name: ai-live-interpreter-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0 && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_API_DOCS
        value: "false"
      - key: KEEP_LATEST_RECORDING
        value: "false"
      - key: AI_MODEL_DIR
        value: /tmp/ai-live-interpreter-models
      - key: UPLOAD_DIR
        value: /tmp/ai-live-interpreter-uploads
